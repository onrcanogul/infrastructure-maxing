services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PAYROUTE_DB_NAME:-payments}
      POSTGRES_USER: ${PAYROUTE_DB_USERNAME:-payments}
      POSTGRES_PASSWORD: ${PAYROUTE_DB_PASSWORD:-payments}
    ports:
      - "${PAYROUTE_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
