spring:
  application:
    name: provider-simulator
  threads:
    virtual:
      enabled: ${PAYROUTE_SIM_VIRTUAL_THREADS:true}

server:
  port: ${PAYROUTE_SIM_PORT:8081}
  shutdown: graceful

app:
  simulator:
    latency: ${PAYROUTE_SIM_LATENCY:200ms}
    approve: ${PAYROUTE_SIM_APPROVE:true}
    timeout-sleep: ${PAYROUTE_SIM_TIMEOUT_SLEEP:60s}
    idempotency:
      ttl: ${PAYROUTE_SIM_IDEMPOTENCY_TTL:10m}
      max-entries: ${PAYROUTE_SIM_IDEMPOTENCY_MAX_ENTRIES:100000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
