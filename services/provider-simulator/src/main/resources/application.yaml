spring:
  application:
    name: provider-simulator
  threads:
    virtual:
      # Every request parks for app.simulator.latency. On platform threads the simulator would run
      # out of threads long before payment-service ran out of connections, and the lab would be
      # measuring the wrong ceiling.
      enabled: ${PAYROUTE_SIM_VIRTUAL_THREADS:true}

server:
  port: ${PAYROUTE_SIM_PORT:8081}
  shutdown: graceful

app:
  simulator:
    latency: ${PAYROUTE_SIM_LATENCY:200ms}
    approve: ${PAYROUTE_SIM_APPROVE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
